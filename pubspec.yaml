name: expense_manager
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.2
  path: ^1.9.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  uuid: ^4.4.0
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  fl_chart: ^0.69.0
  shared_preferences: ^2.2.3
  csv: ^6.0.0
  path_provider: ^2.1.2
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  google_sign_in: ^6.2.1
  local_auth: ^2.3.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.3.4
  mocktail: ^1.0.4


flutter_native_splash:
  color: "#1E1E2C"
  image: assets/images/expense_manager_logo.png
  android_12:
    image: assets/images/expense_manager_logo.png
    icon_background_color: "#1E1E2C"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/expense_manager_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/expense_manager_logo.png